model:
  train: distilbert-base-uncased
  eval: bert-large-uncased
  max_length: 128
  type: seq_classification
  num_labels: 2
  # Phases load one model at a time so the default run fits ~4GB VRAM.

dataset:
  name: imdb
  text_column: text
  label_column: label
  max_samples: 1000 # Limit to 1000 to keep execution time reasonable

training:
  epochs: 1
  num_cycles: 1
  batch_size: 8
  learning_rate: 2.0e-5
  nightmare_epochs: 1
  dream_epochs: 1

evaluation:
  distortions:
    - typo
    - keyboard
    - swap
    - deletion
    - homoglyph
  robustness_strengths: [0.1, 0.3, 0.5]

metrics:
  - robustness_score
  - clean_accuracy
  - inference_time
