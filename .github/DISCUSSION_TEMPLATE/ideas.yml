title: "[Idea]: "
body:
  - type: markdown
    attributes:
      value: |
        Share a feature idea or suggestion for NightmareNet. This isn't a formal issue yet — just a place to propose and discuss before it becomes one.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: What's missing or frustrating right now?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed Solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any other approaches you thought about?
    validations:
      required: false