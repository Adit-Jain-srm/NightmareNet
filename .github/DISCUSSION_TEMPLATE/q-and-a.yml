title: "[Q&A]: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Ask a question about using or contributing to NightmareNet.
        Check the [FAQ](https://github.com/Adit-Jain-srm/NightmareNet#frequently-asked-questions-faq) first.

  - type: textarea
    id: question
    attributes:
      label: Question
      description: What are you trying to do, and where are you stuck?
      placeholder: How do I run a short Wake → Dream cycle on SST-2 with CPU only?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Help us reproduce context.
      placeholder: |
        - OS: macOS 15 / Ubuntu 22.04 / Windows 11
        - Python: 3.12.x
        - Install: pip install -e ".[dev,api]"
        - GPU: none / CUDA 12.x
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: NightmareNet version
      description: Output of `python -c "import nightmarenet; print(nightmarenet.__version__)"` or the git SHA.
      placeholder: 0.4.0 or git SHA
    validations:
      required: false

  - type: textarea
    id: tried
    attributes:
      label: What you already tried
      placeholder: Commands run, docs/pages checked, error text (if any).
    validations:
      required: false

  - type: checkboxes
    id: searched
    attributes:
      label: Before posting
      options:
        - label: I searched existing Discussions and Issues for a similar question
          required: true
