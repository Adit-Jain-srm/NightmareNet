name: Weekly Security & Vulnerability Scan

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight UTC
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  weekly-scan:
    name: Weekly Security & Vulnerability Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]>=1.7" "pip-audit>=2.7"
          pip install -e ".[api]"

      - name: Run bandit (static security analysis)
        run: |
          bandit -r nightmarenet -ll \
            --format json \
            --output bandit-report.json \
            --exit-zero
          bandit -r nightmarenet -ll --exit-zero

      - name: Run pip-audit (Python dependency vulnerability scan)
        run: |
          IGNORE_ARGS=()
          if [ -f .pip-audit-known-vulnerabilities ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              clean=$(echo "$line" | sed 's/#.*//' | xargs)
              if [ -n "$clean" ]; then
                IGNORE_ARGS+=("--ignore-vuln" "$clean")
              fi
            done < .pip-audit-known-vulnerabilities
          fi
          pip-audit \
            --progress-spinner=off \
            --format json \
            --output pip-audit-report.json \
            "${IGNORE_ARGS[@]}" || true
          pip-audit --progress-spinner=off "${IGNORE_ARGS[@]}" || true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Run npm audit (Node.js dependency vulnerability scan)
        working-directory: frontend
        run: |
          npm audit --audit-level=high || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: weekly-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: warn
