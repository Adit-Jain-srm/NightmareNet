name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Tests & Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"

      # Ruff lint/format run in .github/workflows/pre-commit.yml (avoids duplicate checks)

      - name: Type check with mypy (strict, baseline-enforced)
        # Strict mode is enforced repo-wide, but pre-existing violations in
        # mypy_baseline.txt are frozen and don't fail CI. Only NEW errors -
        # in new files, or new lines in changed files - fail the build.
        # See docs/development/code-style.md for the full policy and how to
        # update the baseline.
        if: matrix.python-version == '3.12'
        run: |
          set +e
          set -o pipefail

          mypy nightmarenet/ --python-version 3.12 | tee mypy-output.txt | mypy-baseline filter --baseline-path mypy_baseline.txt --allow-unsynced | tee mypy-filter-output.txt
          statuses=("${PIPESTATUS[@]}")
          mypy_status="${statuses[0]}"
          baseline_status="${statuses[2]}"

          echo "mypy exit status: ${mypy_status}"
          echo "mypy-baseline filter exit status: ${baseline_status}"

          # mypy uses exit code 1 for ordinary type-checking diagnostics.
          # The baseline filter decides whether those diagnostics are new.
          # Exit codes >1 indicate an actual mypy execution failure.
          if [ "${mypy_status}" -gt 1 ]; then
            echo "::error::mypy failed to execute correctly (exit code ${mypy_status})."
            exit "${mypy_status}"
          fi

          if [ "${baseline_status}" -ne 0 ]; then
            echo "::error::New mypy errors were introduced (not present in mypy_baseline.txt)."
            exit "${baseline_status}"
          fi

          if grep -Eiq "resolved|fixed" mypy-filter-output.txt; then
            echo "::notice::Existing mypy baseline entries were fixed; contributor reduced type-checking debt."
          else
            echo "Mypy baseline unchanged: existing baseline findings are allowed."
          fi

      - name: Run tests with coverage
        working-directory: .
        env:
          HF_HUB_DOWNLOAD_TIMEOUT: 60
          HF_DATASETS_TIMEOUT: 60
        run: |
          PYTHONPATH=. pytest -m "not slow" --cov=nightmarenet --cov-report=xml --cov-report=term-missing > pytest_output.txt 2>&1 || true
          cat pytest_output.txt
          if grep -q "failed" pytest_output.txt; then exit 1; fi

      - name: Upload Pytest Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-${{ matrix.python-version }}
          path: pytest_output.txt

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          flags: unittests
          name: nightmarenet-coverage
          fail_ci_if_error: false
          verbose: true

      - name: Validate notebooks with nbmake
        if: matrix.python-version == '3.12'
        continue-on-error: true
        run: >
          pytest --nbmake notebooks/ --timeout=120

      - name: Check OpenAPI spec drift
        if: matrix.python-version == '3.12'
        run: PYTHONPATH=. python scripts/export_openapi.py --check

      - name: Set up Node.js
        if: matrix.python-version == '3.12'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        if: matrix.python-version == '3.12'
        working-directory: frontend
        env:
          NPM_CONFIG_FETCH_RETRIES: 5
          NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: 20000
          NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: 120000
          NPM_CONFIG_FETCH_TIMEOUT: 300000
        run: npm ci

      - name: Lint frontend
        if: matrix.python-version == '3.12'
        working-directory: frontend
        run: npm run lint

      - name: Type-check frontend
        if: matrix.python-version == '3.12'
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Run frontend unit tests
        if: matrix.python-version == '3.12'
        working-directory: frontend
        run: npm test

      - name: Build frontend
        if: matrix.python-version == '3.12'
        working-directory: frontend
        run: npm run build

      - name: Check frontend bundle size
        if: matrix.python-version == '3.12' && github.event_name == 'pull_request'
        uses: andresz1/size-limit-action@94bc357df29c36c8f8d50ea497c3e225c3c95d1d # v1.8.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          directory: frontend
          skip_step: build

      - name: Install Playwright Chromium
        if: matrix.python-version == '3.12'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run accessibility tests
        if: matrix.python-version == '3.12'
        working-directory: frontend
        run: npm run test:a11y -- --project=chromium

      - name: Upload Playwright report
        if: always() && matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: playwright-accessibility-report
          path: frontend/playwright-report/
          if-no-files-found: ignore

      - name: Upload coverage
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage.xml

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install security tooling
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]>=1.7" "pip-audit>=2.7"
          pip install -e ".[api]"

      - name: Run bandit (static security analysis)
        run: |
          bandit -r nightmarenet -ll \
            --format json \
            --output bandit-report.json \
            --exit-zero
          bandit -r nightmarenet -ll --exit-zero

      - name: Run pip-audit (dependency vulnerability scan)
        run: |
          pip-audit \
            --progress-spinner=off \
            --format json \
            --output pip-audit-report.json \
            || true
          pip-audit --progress-spinner=off || true

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: warn

  docker-build:
    name: Docker Build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: api
            dockerfile: docker/Dockerfile.api
            tag: nightmarenet/api:ci
          - image: worker
            dockerfile: docker/Dockerfile.worker
            tag: nightmarenet/worker:ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Build ${{ matrix.image }} image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: ${{ matrix.tag }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=min

      - name: Smoke-test image
        run: echo "Build verified (image not loaded to save disk space)"
