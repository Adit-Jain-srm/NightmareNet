# NightmareNet — Render Blueprint
# Deploy the FastAPI backend as a Docker-based web service.
# The API serves distortion generation, robustness evaluation,
# and pipeline orchestration endpoints.
#
# Free-tier notes:
#   - 512 MB RAM, 0.1 CPU — sufficient for the API (no GPU needed).
#   - Cold start on first request after inactivity.
#   - PyTorch is installed but the API only uses CPU distortion functions.

services:
  - type: web
    name: nightmarenet-api
    runtime: docker
    repo: https://github.com/Adit-Jain-srm/NightmareNet
    branch: main
    plan: free
    dockerfilePath: docker/Dockerfile.api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NIGHTMARENET_CORS_ORIGINS
        value: "*"
      - key: NIGHTMARENET_LOG_LEVEL
        value: info
      - key: PORT
        value: "8000"
      - key: PYTHONUNBUFFERED
        value: "1"
    autoDeploy: true